          type: string
          enum:
          - sowing
          - transplanting
          - irrigation
          - fertilization
          - inspection
          - harvest
          title: Event Type
        occurred_on:
          type: string
          format: date
          title: Occurred On
        quantity:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
