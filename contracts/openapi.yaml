        occurred_on:
          type: string
          format: date
          title: Occurred On
        quantity:
          anyOf:
          - type: number
            maximum: 1000000.0
            exclusiveMinimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d{0,6}0*$
          - type: 'null'
          title: Quantity
        unit:
          anyOf:
          - type: string
            enum:
            - mm
            - m3
            - kg/mu
            - kg/ha
          - type: 'null'
          title: Unit
        material_name:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Material Name
        notes:
          type: string
          maxLength: 2000
          title: Notes
          default: ''
        correction_reason:
          type: string
          maxLength: 240
          minLength: 1
          title: Correction Reason
      additionalProperties: false
      type: object
      required:
      - event_type
      - occurred_on
      - correction_reason
      title: EventCorrection
      description: A full replacement operation with a required explanation.
