[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "crop-twin-engine"
version = "0.3.0"
description = "Versioned inputs and isolated PCSE potential growth simulation"
requires-python = ">=3.12,<3.13"
dependencies = ["pcse==6.0.13"]

[tool.hatch.build.targets.wheel]
packages = ["src/crop_engine"]
