name: development-checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: crop_twin_test
          POSTGRES_USER: crop_twin_test
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crop_twin_test -d crop_twin_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      CROP_TWIN_TEST_POSTGRES_URL: postgresql+psycopg://crop_twin_test:ci-test-only@127.0.0.1:5432/crop_twin_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.23
      - run: uv sync --locked --all-packages --group dev
      - run: uv run --locked ruff check backend packages scripts
      - run: uv run --locked ruff format --check backend packages scripts
      - run: uv run --locked mypy
      - run: uv run --locked mypy --platform win32
      - run: uv run --locked pytest --cov=crop_twin --cov=crop_engine --cov-report=term-missing --cov-fail-under=80
      - run: uv run --locked python scripts/export_openapi.py --check
      - run: uv run --locked python scripts/check_workspace.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.23
      - run: uv sync --locked --all-packages --group dev
        working-directory: .
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
