name: scaffold-checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.23
      - run: uv sync --locked --all-packages --group dev
      - run: uv run --locked ruff check backend packages scripts
      - run: uv run --locked ruff format --check backend packages scripts
      - run: uv run --locked mypy
      - run: uv run --locked pytest
      - run: uv run --locked python scripts/export_openapi.py --check
      - run: uv run --locked python scripts/check_workspace.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
